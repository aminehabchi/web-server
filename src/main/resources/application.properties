# Server 1
server.1.hosts=192.168.1.10,10.0.0.5
server.1.ports=8081,8443
server.1.default=true
server.1.clientMaxBodySize=5242880
server.1.errorPages.404=/errors/404.html
server.1.errorPages.403=/errors/403.html
server.1.errorPages.500=/errors/500.html

server.1.route.1.path=/
server.1.route.1.methods=GET,POST
server.1.route.1.root=/var/www/main
server.1.route.1.indexFile=home.html
server.1.route.1.directoryListing=false

server.1.route.2.path=/downloads
server.1.route.2.methods=GET
server.1.route.2.root=/var/www/downloads
server.1.route.2.directoryListing=true

server.1.route.3.path=/scripts
server.1.route.3.methods=GET,POST
server.1.route.3.cgi.php=/usr/bin/php
server.1.route.3.cgi.pl=/usr/bin/perl

# Server 2
server.2.hosts=dev.local,127.0.0.1
server.2.ports=5000,5002
server.2.default=false
server.2.clientMaxBodySize=10485760
server.2.errorPages.404=/errors/404.html
server.2.errorPages.401=/errors/401.html

server.2.route.1.path=/
server.2.route.1.methods=GET
server.2.route.1.root=/var/www/dev
server.2.route.1.indexFile=index.html

server.2.route.2.path=/dashboard
server.2.route.2.methods=GET
server.2.route.2.root=/var/www/dashboard

server.2.route.3.path=/api/v2
server.2.route.3.methods=GET,POST
server.2.route.3.cgi.py=/usr/bin/python3
server.2.route.3.cgi.rb=/usr/bin/ruby