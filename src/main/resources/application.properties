# ================================================================================
# JAVA-LOCALSERVER CONFIGURATION
# ================================================================================
# This configuration defines 3 virtual servers demonstrating all features
# ================================================================================

# ================================================================================
# SERVER 1: Main Application Server (Port 8080)
# ================================================================================
# Primary server handling static files, images, and API endpoints

server.1.hosts=localhost,test.com
server.1.ports=8080,8443
server.1.default=true
server.1.clientMaxBodySize=5242880
server.1.sessionTimeout=1800

# Custom error pages
server.1.errorPages.403=/errors/403.html
server.1.errorPages.404=/errors/404.html
server.1.errorPages.405=/errors/405.html
server.1.errorPages.413=/errors/413.html
server.1.errorPages.500=/errors/500.html

# Route 1: Image Gallery
server.1.route.1.path=/gallery
server.1.route.1.methods=GET
server.1.route.1.root=/images
server.1.route.1.indexFile=index.html
server.1.route.1.directoryListing=false

# Route 2: Files with Directory Listing
server.1.route.2.path=/files
server.1.route.2.methods=GET
server.1.route.2.root=/files
server.1.route.2.directoryListing=true

# Route 3: Direct Image Access
server.1.route.3.path=/images
server.1.route.3.methods=GET
server.1.route.3.root=/images
server.1.route.3.directoryListing=false

# Route 4: API Endpoints (handled by @Controller)
server.1.route.4.path=/api
server.1.route.4.methods=GET,POST,DELETE


# ================================================================================
# SERVER 2: CGI Script Server (Port 5000)
# ================================================================================
# Dedicated server for executing CGI scripts (Python, JavaScript)

server.2.hosts=test2.com
server.2.ports=8080,5001
server.2.default=false
server.2.clientMaxBodySize=10485760
server.2.sessionTimeout=1000

# Error pages
server.2.errorPages.404=/errors/404.html
server.2.errorPages.500=/errors/500.html

# Route 1: Python CGI Scripts
server.2.route.1.path=/python
server.2.route.1.methods=GET,POST
server.2.route.1.cgi.py=/usr/bin/python3
server.2.route.1.root=/scripts

# Route 2: Node.js CGI Scripts
server.2.route.2.path=/nodejs
server.2.route.2.methods=GET,POST
server.2.route.2.cgi.js=/usr/bin/node
server.2.route.2.root=/scripts

# Route 3: All CGI Scripts (Multi-language)
server.2.route.3.path=/cgi-bin
server.2.route.3.methods=GET,POST
server.2.route.3.cgi.py=/usr/bin/python3
server.2.route.3.cgi.js=/usr/bin/node
server.2.route.3.root=/scripts

# Route 4: API endpoints
server.2.route.4.path=/api
server.2.route.4.methods=GET,POST,DELETE


# ================================================================================
# SERVER 3: Redirect & Image Server (Port 8888)
# ================================================================================
# Demonstrates URL redirects and serves images

server.3.hosts=localhost,127.0.0.1
server.3.ports=8888,9000
server.3.default=false
server.3.clientMaxBodySize=13581216520
server.3.sessionTimeout=1000

server.3.errorPages.404=/errors/404.html
server.3.errorPages.403=/errors/403.html
server.3.errorPages.500=/errors/500.html

# Route 1: Redirect root to gallery (301 Permanent)
server.3.route.1.path=/
server.3.route.1.methods=GET,POST
server.3.route.1.redirect.status=301
server.3.route.1.redirect.to=/myimages

# Route 2: Redirect /old-files to /files (302 Temporary)
server.3.route.2.path=/old-files
server.3.route.2.methods=GET
server.3.route.2.redirect.status=302
server.3.route.2.redirect.to=/files

# Route 3: Image Gallery with Directory Listing
server.3.route.3.path=/myimages
server.3.route.3.methods=GET
server.3.route.3.root=/images
server.3.route.3.indexFile=index.html
server.3.route.3.directoryListing=true

# Route 4: File Downloads
server.3.route.4.path=/files
server.3.route.4.methods=GET
server.3.route.4.root=/files
server.3.route.4.directoryListing=true

# Route 5: API Endpoints
server.3.route.5.path=/api
server.3.route.5.methods=GET,POST,DELETE


# ================================================================================
# CONFIGURATION SUMMARY
# ================================================================================
#
# SERVER 1 (8080, 8443) - Main Application Server
#   - /gallery       -> Image gallery (index.html)
#   - /files         -> File listing (directory browsing enabled)
#   - /images        -> Direct image access
#   - /api/*         -> REST API endpoints via @Controller
#
# SERVER 2 (5000, 5001) - CGI Execution Server
#   - /python/*      -> Python CGI scripts
#   - /nodejs/*      -> Node.js CGI scripts
#   - /cgi-bin/*     -> Multi-language CGI
#   - /api/*         -> REST API endpoints
#
# SERVER 3 (8888, 9000) - Redirect & Image Server
#   - /              -> Redirects to /myimages (301)
#   - /old-files     -> Redirects to /files (302)
#   - /myimages      -> Image gallery with directory listing
#   - /files         -> File downloads
#   - /api/*         -> REST API endpoints
#
