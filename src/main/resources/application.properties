# ===============================
# Server Core Configuration
# ===============================

# Comma-separated ports
server.ports=8080,8081

# Max request body size (bytes)
server.maxBodySize=10485760

# Connection timeout (milliseconds)
server.connectionTimeout=5000

# Thread pool size
server.threadPool=16

# Max simultaneous connections
server.maxConnections=1000

# TCP backlog size
server.backlog=50

# Enable debug mode
server.debug=true


# ===============================
# Session Configuration
# ===============================

session.name=SESSION_ID

# Session timeout in seconds
session.timeout=1800

# Cookie security settings
session.secure=false
session.httpOnly=true

# Cookie path
session.path=/

# SameSite policy: Strict | Lax | None
session.sameSite=Lax


# ===============================
# Custom / Extra Configs
# ===============================

configs.environment=development
configs.serverName=MyHttpServer
configs.version=1.0.0
