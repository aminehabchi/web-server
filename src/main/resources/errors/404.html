<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Error</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .error-box {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 48px;
            margin: 0;
            color: #e74c3c;
        }

        p {
            margin: 10px 0 0;
            color: #555;
        }
    </style>
</head>

<body>
    <div class="error-box">
        <h1>404</h1>
        <p>Page Not Found</p>
    </div>
</body>

</html>
